name: Grünflächen-Daten

# Berechnet die Grünflächen-Anker (data/green/) aus OpenStreetMap-Extrakten der Geofabrik neu,
# monatlich und bei Änderungen am Generator oder an der Regionenliste.

on:
  schedule:
    - cron: "17 3 3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/green_anchors.py", "data/regions.json", ".github/workflows/green-data.yml"]

permissions:
  contents: write

concurrency:
  group: green-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anker berechnen
        run: python tools/green_anchors.py --regions data/regions.json --out data/green

      - name: Änderungen übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/green
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -q -m "Grünflächen-Daten aktualisieren ($(date -u +%Y-%m-%d))"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
