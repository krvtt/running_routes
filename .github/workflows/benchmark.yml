name: Benchmark

# Misst die Routenqualität mit echten Kartendaten (Hamburg, Berlin) gegen einen eigenen BRouter-Server.
# Ergebnisse landen auf dem Branch "bench-results" (runs/<Zeit>-<Commit>/ und latest/).

on:
  push:
    branches: [main]
    paths: ["app.js", "profiles/**", "bench/**", "data/**", ".github/workflows/benchmark.yml"]
  workflow_dispatch:
    inputs:
      baseline:
        description: "Vergleichsversionen (Commits oder Tags, durch Leerzeichen getrennt)"
        default: "5787162 3aa0e38"
      only:
        description: "Nur Fälle, deren id diesen Text enthält (leer = alle)"
        default: ""

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: true

env:
  BASELINES: ${{ inputs.baseline || '5787162 3aa0e38' }}
  BROUTER_HOME: /home/runner/brouter

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monat für den Cache
        id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: BRouter und Kartendaten aus dem Cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BROUTER_HOME }}
          key: brouter-1.7.10-${{ steps.month.outputs.m }}

      - name: BRouter einrichten und starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: bench/setup-brouter.sh E5_N50 E10_N50

      - name: Cache speichern
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BROUTER_HOME }}
          key: brouter-1.7.10-${{ steps.month.outputs.m }}

      - name: Playwright, osmium und matplotlib installieren
        run: |
          pip install --quiet playwright matplotlib pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq osmium-tool > /dev/null

      - name: OpenStreetMap-Extrakte für die Karten aus dem Cache
        id: osmcache
        uses: actions/cache@v4
        with:
          path: /home/runner/osm
          key: osm-${{ steps.month.outputs.m }}

      - name: OpenStreetMap-Extrakte laden
        if: steps.osmcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/osm
          python - <<'PY'
          import json, os, urllib.request
          for r in json.load(open("data/regions.json")):
              path = os.path.join("/home/runner/osm", os.path.basename(r["pbf"]))
              req = urllib.request.Request(r["pbf"], headers={"User-Agent": "laufrouten-benchmark"})
              with urllib.request.urlopen(req, timeout=600) as resp, open(path, "wb") as fh:
                  fh.write(resp.read())
          PY

      - name: App-Versionen ausliefern
        run: |
          (python -m http.server 8765 > /dev/null 2>&1 &)
          port=8766
          for ref in $BASELINES; do
            git worktree add --detach "../v-$ref" "$ref"
            (cd "../v-$ref" && python -m http.server $port > /dev/null 2>&1 &)
            echo "--app=$ref=http://localhost:$port/" >> ../apps.txt
            port=$((port + 1))
          done
          sleep 2

      - name: Benchmark
        run: |
          ONLY="${{ inputs.only }}"
          mapfile -t APPS < ../apps.txt
          python bench/run.py --brouter http://localhost:17777 --app neu=http://localhost:8765/ "${APPS[@]}" \
            ${ONLY:+--only "$ONLY"} --out bench-out

      - name: Karten
        continue-on-error: true
        run: python bench/maps.py --routes bench-out/routes.json --osm /home/runner/osm --green data/green --out bench-out/maps

      - name: Protokolle sammeln
        if: always()
        run: |
          mkdir -p bench-out
          tail -n 200 "$BROUTER_HOME/server.log" > bench-out/brouter.log 2>/dev/null || echo "kein Server-Log" > bench-out/brouter.log
          ls -la "$BROUTER_HOME" "$BROUTER_HOME/segments4" > bench-out/dateien.txt 2>&1 || true
          echo "Commit ${GITHUB_SHA::7}, Lauf ${{ github.run_id }}, Status ${{ job.status }}" > bench-out/lauf.txt

      - name: Ergebnisse auf bench-results ablegen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir ../results && cd ../results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          if git fetch -q --depth 1 origin bench-results; then git checkout -q -b bench-results FETCH_HEAD; else git checkout -q --orphan bench-results; fi
          mkdir -p "runs/$RUN" && cp -r "$GITHUB_WORKSPACE/bench-out/." "runs/$RUN/" && rm -rf "runs/$RUN/maps" "runs/$RUN/routes.json"  # Karten nur in latest/
          rm -rf latest && mkdir latest && cp -r "$GITHUB_WORKSPACE/bench-out/." latest/
          git add -A
          git commit -q -m "Benchmark $RUN"
          git push -q origin HEAD:bench-results
